[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorial-alias-audit"
version = "0.1.0a1"
description = "FR: Révéler les effets confondus dans un plan expérimental | EN: Expose aliased effects in an experimental design | ES: Revelar efectos confundidos en un diseño experimental"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
factorial-alias-audit = "factorial_alias_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["factorial_alias_audit*"]
